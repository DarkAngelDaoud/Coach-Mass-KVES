<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach Masse</title>
<meta name="theme-color" content="#0C1318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><span class="brand">COACH MASSE</span><span id="weekTag" class="tag"></span></header>
<main id="view" aria-live="polite"></main>
<nav class="tabs" id="nav" aria-label="Navigation">
  <button data-act="tab" data-v="today">Aujourd'hui</button>
  <button data-act="tab" data-v="train">Séance</button>
  <button data-act="tab" data-v="meals">Repas</button>
  <button data-act="tab" data-v="track">Suivi</button>
  <button data-act="tab" data-v="history">Historique</button>
  <button data-act="tab" data-v="more">Plus</button>
</nav>
<div id="runner" class="runner" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="importFile" accept="application/json" hidden>
<input type="file" id="keyFile" accept="application/json,.json" hidden>
<input type="file" id="avisFile" accept="text/plain,.txt,.eml" multiple hidden>
<script src="avis-config.js"></script>
<script src="app.js"></script>
</body>
</html>
